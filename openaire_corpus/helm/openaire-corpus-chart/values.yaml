namespace: openaire-corpus

# ===========================================================================
# App (Next.js) — the Corpus / Ingest / Research workspace.
# ===========================================================================
replicaCount: 1

image:
  repository: rg.fr-par.scw.cloud/ns-data-streaming/openaire-corpus
  pullPolicy: Always
  tag: "0.2.0"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# App boots at root `/`; the locale middleware 307-redirects, which counts as a
# probe success (k8s treats any 2xx/3xx as healthy).
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

config:
  # Public hostname the app is served on. BETTER_AUTH_URL and APP_URL both use
  # it; APP_URL is the base for cluster-callback URLs (overridden in-cluster by
  # WORKER_CALLBACK_BASE_URL, set automatically — see configmap.yaml).
  publicUrl: https://openaire.demo.alien.club

  # Ingest path + research RAG path. "real" routes ingestion to the bundled
  # worker (WORKER_RUNNER_URL) and RAG to the data-cluster MCP. "fake" uses the
  # in-process fixtures (no worker, no network) — handy for a UI-only deploy.
  clusterMode: real

  # OpenAIRE MCP — corpus building (Corpus step). URL is public; token is a
  # secret (openaireMcpTokenProperty). Hosted mcp-openaire (openaire_kg_* /
  # openaire_sx_* tools).
  openaireMcpUrl: https://openaire.mcp.alien.club/mcp

  # Data-cluster MCP — research RAG (Research step), required when clusterMode=real.
  # The research agent's rag_query tool queries this over dataset `openaire-<projectId>`.
  # This is the multi-cluster aggregator endpoint (composite ids, stateless).
  dataclusterMcpUrl: https://mcp.alien.club/mcp?config=cfg_GBLcpF0QcE-G

  # Langfuse observability — OPTIONAL. Set publicKey here + secretKey in the
  # ExternalSecret to enable per-turn tracing. Leave blank → tracing off.
  langfusePublicKey: "pk-lf-014385ed-18f6-4fa1-84eb-4a7fdc7c7adf"
  langfuseBaseUrl: https://langfuse.alien.club

  # Alien Auth (Authentik) SSO. Base URL + app slug are non-secret (here); the
  # client id/secret are pulled from Scaleway via the ExternalSecret below.
  # Shared with the other demos (same Authentik application). The OAuth callback
  # `https://openaire.demo.alien.club/api/auth/oauth2/callback/authentik`
  # must be registered on that application or Authentik rejects the flow.
  authentikBaseUrl: https://auth.alien.club
  authentikAppSlug: datastreaming

  # Service name reported to SigNoz. Keep stable across deploys.
  otelServiceName: "openaire-corpus-prod"

  # Agent provider — which gateway drives the `claude` agent mode.
  # "anthropic" (default) calls Anthropic with ANTHROPIC_API_KEY; "openrouter"
  # routes turns+tools+MCP through OpenRouter (one key, all vendors — incl. the
  # default model GLM 5.2, which is NOT Anthropic so it ONLY works under
  # openrouter). When openrouter, OPENROUTER_API_KEY MUST be set (pulled via the
  # -app-creds ExternalSecret below) or the app refuses to boot.
  agentProvider: openrouter

# ===========================================================================
# Ingest worker (worker-v2) — the major difference from a plain web app.
#
# A long-running consumer: it pulls doc-ingest jobs from a pg-boss queue (in the
# bundled Postgres) and runs the per-doc pipeline
#   resolve → [fetch-pdf → extract] → prepare → embed → register
# against the OpenAIRE Graph API / Mistral OCR / RunPod / the data cluster, and
# serves an HTTP submit API on :7777 that the app calls (WORKER_RUNNER_URL).
# pg-boss row-locks make it safe to scale horizontally (worker.replicaCount > 1)
# — they share one queue.
#
# Active only when config.clusterMode=real. In fake mode set worker.enabled=false.
# ===========================================================================
worker:
  enabled: true
  replicaCount: 1

  image:
    repository: rg.fr-par.scw.cloud/ns-data-streaming/openaire-corpus-worker
    pullPolicy: Always
    tag: "0.2.0"

  service:
    type: ClusterIP
    port: 7777

  config:
    # --- Blob storage (S3) — heavy bytes live off-queue ---
    s3Bucket: bnf-corpus-demo
    s3Endpoint: https://s3.fr-par.scw.cloud
    s3Region: fr-par
    # OpenAIRE artifacts sit under a dedicated prefix so they never collide with
    # other tenants in the shared bucket (matches the verified local run).
    s3Prefix: "openaire-jats/"

    # --- OpenAIRE Graph API + ScholeXplorer (public; token optional) ---
    # openaireApiBase left unset → the client's default (api.openaire.eu/graph/v1).
    openaireApiBase: ""
    # Resolve rate (products/min) — the ungated public-API politeness cap.
    openaireRpm: "60"
    # ScholeXplorer citation-link enrichment (cited-by / references counts).
    scholexEnabled: "true"
    scholexRpm: "60"

    # --- Full-text lane ---
    # true = fetch open-access PDFs and OCR them via Mistral (per-page full text +
    # inline figure captions + figure image files). Kept as the JATS lane's fallback.
    fulltextEnabled: "true"
    # JATS structured-text lane (preferred): Europe PMC → publisher (eLife/PLOS) →
    # Unpaywall → PDF+OCR → abstract. Clean sections, no OCR error rate.
    jatsEnabled: "true"
    # Unpaywall OA-PDF fallback tier (needs contactEmail; skipped without it).
    unpaywallEnabled: "true"
    # Contact email — required by Unpaywall's API, sent as the Europe PMC UA.
    contactEmail: "leo@alien.club"
    mistralOcrModel: mistral-ocr-latest
    # Per-host PDF-fetch politeness rate (requests/min/host) + size/page ceilings.
    pdfHostRpm: "60"
    pdfMaxBytes: "52428800"
    pdfMaxPages: "500"

    # --- RunPod bge-m3 embedder (key is a secret) ---
    runpodEndpointId: pngrbp0y1aj28i
    runpodEmbeddingModel: BAAI/bge-m3

    # --- Data cluster (register/upsert). bearer token is a secret. ---
    # Proxy base = backendApiUrl + /clusters/<id>/proxy. clusterId MUST match the
    # dataset region the app's DATACLUSTER_MCP_URL points at (cluster 111 on prod).
    backendApiUrl: https://api.alien.club
    clusterId: "111"

    # --- Per-stage concurrency ---
    resolveConcurrency: "6"
    fetchPdfConcurrency: "8"
    extractConcurrency: "4"
    prepareConcurrency: "8"
    embedConcurrency: "8"
    # Data-cluster register (indexing) concurrency — the cluster autoscales.
    registerConcurrency: "24"
    # Processing rate (docs/min) used for the read-model ETA.
    processRpm: "300"

  resources:
    requests:
      cpu: 250m
      # Full-text runs hold PDF bytes + OCR page images in memory; provision
      # generously (RAM is cheap; nodes have ~30Gi) rather than trimming
      # concurrency to save memory.
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 10Gi

  # The worker drains in-flight jobs on SIGTERM; give it room (a doc can be
  # mid-OCR). Must comfortably exceed a single doc's prepare time, not the full
  # job ceiling.
  terminationGracePeriodSeconds: 120

# ===========================================================================
# Bundled Postgres — single replica, PVC-backed, no replication. Shared by the
# app (domain tables + better-auth) and the worker (pg-boss queue, own schema).
# Fine for a demo; not for real production data.
# ===========================================================================
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: openaire_corpus
  username: openaire_corpus
  # Password generated once and preserved across upgrades (see postgres-secret.yaml).
  port: 5432
  persistence:
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # storageClassName: leave unset to use the cluster default (sbs-default on Scaleway)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ===========================================================================
# Istio ingress. openaire.demo.alien.club is a dedicated subdomain served at
# root (no basePath / URI rewrite), so the chart provisions its OWN Gateway +
# cert-manager Certificate. Requires DNS openaire.demo.alien.club → istio ingress
# and the `letsencrypt` ClusterIssuer.
# ===========================================================================
istio:
  hosts:
    - host: openaire.demo.alien.club
      path: /
      gateway: own

  gatewayNamespace: istio-system
  # REQUIRED only if any host uses `gateway: shared`. Name of an existing Istio
  # Gateway already serving the host. Discover with:
  #   kubectl get vs -A -o wide | grep <host>
  sharedGatewayName: ""

  gateway:
    # Required true if any host uses `gateway: own`. Provisions a Gateway
    # covering the `own` hosts (port 80 for ACME HTTP-01 + 443 TLS).
    create: true

  virtualService:
    enabled: true
    # Both null on purpose — the agent streams SSE for the full duration of a
    # turn (a finite timeout would chop long answers), and POST /api/.../messages
    # has side effects (creates rows, starts a run) so auto-retry would duplicate.
    # Istio rejects "0s" but treats an absent field as "no limit / no retries".
    timeout: null
    retries: null

  certificate:
    # Required true if any host uses `gateway: own`. Issues a Certificate
    # covering all `own` hosts and mounts it as the Gateway's TLS credential.
    enabled: true
    issuerName: letsencrypt

# ===========================================================================
# Secrets — pulled from Scaleway Secret Manager via external-secrets. One
# remote secret holds all real credentials as properties; each property below
# maps to one env var. Leave a property name blank to skip that key.
# ===========================================================================
secrets:
  # Name of the Scaleway Secret Manager secret holding every credential below.
  scalewaySecretName: openaire-corpus-prod

  # --- App credentials ---
  anthropicApiKeyProperty: ANTHROPIC_API_KEY
  # OpenAIRE MCP token — corpus building.
  openaireMcpTokenProperty: OPENAIRE_MCP_TOKEN
  # data-cluster bearer (RAG via datacluster MCP); shared with the worker.
  clusterBearerTokenProperty: CLUSTER_BEARER_TOKEN
  # Optional — only consumed if config.langfusePublicKey is set.
  langfuseSecretKeyProperty: LANGFUSE_SECRET_KEY
  # OpenRouter API key — only pulled when config.agentProvider == "openrouter".
  openrouterApiKeyProperty: OPENROUTER_API_KEY

  # --- Alien Auth (Authentik) SSO credentials ---
  # AUTHENTIK_CLIENT_ID / AUTHENTIK_CLIENT_SECRET live in a SHARED Scaleway
  # secret (`authentik-prod`), NOT the per-demo secret — the same OAuth
  # application is reused across all demos (openaire, agents, bnf). Pulled into a
  # dedicated ExternalSecret and projected via envFrom only when
  # config.authentikBaseUrl is set.
  authentikScalewaySecretName: authentik-prod

  # --- Worker credentials ---
  scwS3AccessKeyProperty: SCW_S3_ACCESS_KEY
  scwS3SecretKeyProperty: SCW_S3_SECRET_KEY
  runpodApiKeyProperty: RUNPOD_API_KEY
  # Mistral OCR — the full-text extractor for OA PDFs (worker only). Only pulled
  # when worker.config.fulltextEnabled.
  mistralApiKeyProperty: MISTRAL_API_KEY

podAnnotations:
  # OTel Node.js auto-instrumentation sidecar (Instrumentation CR in signoz ns).
  instrumentation.opentelemetry.io/inject-nodejs: "signoz/signoz-instrumentation"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
