{{- if and .Values.worker.enabled (eq .Values.config.clusterMode "real") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openaire-corpus.fullname" . }}-worker-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openaire-corpus.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  # --- Worker HTTP API (app → worker job submit) ---
  WORKER_HTTP_PORT: {{ .Values.worker.service.port | quote }}

  # --- Blob storage (S3) — heavy bytes live off-queue. Keys are secrets. ---
  SCW_S3_BUCKET: {{ .Values.worker.config.s3Bucket | quote }}
  SCW_S3_ENDPOINT_URL: {{ .Values.worker.config.s3Endpoint | quote }}
  SCW_S3_REGION: {{ .Values.worker.config.s3Region | quote }}
  # Prefix isolating OpenAIRE artifacts in the shared bucket.
  V2_S3_PREFIX: {{ .Values.worker.config.s3Prefix | quote }}

  # --- OpenAIRE Graph API + ScholeXplorer (public; token optional) ---
  {{- with .Values.worker.config.openaireApiBase }}
  OPENAIRE_API_BASE: {{ . | quote }}
  {{- end }}
  # Resolve rate (products/min) — the ungated public-API politeness cap.
  OPENAIRE_RPM: {{ .Values.worker.config.openaireRpm | quote }}
  # ScholeXplorer citation-link enrichment (cited-by / references counts).
  SCHOLEX_ENABLED: {{ .Values.worker.config.scholexEnabled | quote }}
  SCHOLEX_RPM: {{ .Values.worker.config.scholexRpm | quote }}

  # --- Full-text lane ---
  # true = fetch open-access PDFs and OCR them via Mistral (per-page full text +
  # inline figure captions + figure image files). false = abstract + metadata only.
  FULLTEXT_ENABLED: {{ .Values.worker.config.fulltextEnabled | quote }}
  {{- if .Values.worker.config.fulltextEnabled }}
  # Mistral OCR — the full-text extractor for OA PDFs. Key is a secret
  # (worker-creds: MISTRAL_API_KEY).
  MISTRAL_OCR_MODEL: {{ .Values.worker.config.mistralOcrModel | quote }}
  # Per-host PDF-fetch politeness rate + size/page ceilings.
  PDF_HOST_RPM: {{ .Values.worker.config.pdfHostRpm | quote }}
  PDF_MAX_BYTES: {{ .Values.worker.config.pdfMaxBytes | quote }}
  PDF_MAX_PAGES: {{ .Values.worker.config.pdfMaxPages | quote }}
  {{- end }}

  # --- RunPod bge-m3 embedder (key is a secret) ---
  RUNPOD_EMBEDDING_ENDPOINT_ID: {{ .Values.worker.config.runpodEndpointId | quote }}
  RUNPOD_EMBEDDING_MODEL: {{ .Values.worker.config.runpodEmbeddingModel | quote }}

  # --- Data cluster (register/upsert) — bearer token is a secret. ---
  # Proxy base = backendApiUrl + /clusters/<id>/proxy. clusterId MUST match the
  # dataset region the app's DATACLUSTER_MCP_URL points at.
  BACKEND_API_URL: {{ .Values.worker.config.backendApiUrl | quote }}
  CLUSTER_ID: {{ .Values.worker.config.clusterId | quote }}

  # --- Per-stage concurrency (bounded downstream by openaireRpm / cluster) ---
  RESOLVE_CONCURRENCY: {{ .Values.worker.config.resolveConcurrency | quote }}
  FETCH_PDF_CONCURRENCY: {{ .Values.worker.config.fetchPdfConcurrency | quote }}
  EXTRACT_CONCURRENCY: {{ .Values.worker.config.extractConcurrency | quote }}
  PREPARE_CONCURRENCY: {{ .Values.worker.config.prepareConcurrency | quote }}
  EMBED_CONCURRENCY: {{ .Values.worker.config.embedConcurrency | quote }}
  # Data-cluster register (indexing) concurrency — the cluster autoscales.
  REGISTER_CONCURRENCY: {{ .Values.worker.config.registerConcurrency | quote }}
  # Processing rate (docs/min) used for the read-model ETA.
  PROCESS_RPM: {{ .Values.worker.config.processRpm | quote }}
{{- end }}
