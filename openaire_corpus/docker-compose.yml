networks:
  openaire:
    name: openaire

# OpenAIRE Literature Research — containerized ingest worker.
#
# For LOCAL development the recommended path is to run the worker on the HOST
# (`cd worker-v2 && npm start`) against the platform Postgres already running on
# :5434 — see README "Running a local ingest". This compose file is the
# containerized alternative (closer to prod): it builds the worker image and
# reaches the host's Postgres (:5434) and the host's Next.js app (:3000).
#
# There is NO broker service (OpenAIRE's Graph API + ScholeXplorer are public,
# rate-gated in-process) and NO bundled Postgres (we reuse the platform DB the
# host app also uses, so there is one source of truth).
services:
  ingest-worker:
    build:
      context: ./worker-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - openaire
    extra_hosts:
      # Reach host-side services (Postgres :5434, Next.js app :3000). On Docker
      # Desktop this is automatic; on native Linux we map it to the host gateway.
      - "host.docker.internal:host-gateway"
    env_file:
      # Gitignored; copy from worker-v2/.env.example. Secrets (S3, RunPod,
      # data-cluster) mirror the demo creds; CLUSTER_ID differs (111).
      - ./worker-v2/.env
    environment:
      # In-container, "localhost" is the container itself — rewrite the .env's
      # localhost forms to reach the host. (Host-side tools like seed.ts/status.ts
      # keep using the .env's localhost:5434 directly.)
      DATABASE_URL: "postgresql://platform_user:platform_dev_password@host.docker.internal:5434/openaire_corpus"
      WORKER_HTTP_PORT: "7777"
    ports:
      - "7777:7777"
    stop_grace_period: 60s
    profiles:
      # Opt-in: `docker compose --profile worker up` so the worker doesn't start
      # by accident.
      - worker
